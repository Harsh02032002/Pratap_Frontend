<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roomhy Admin Panel</title>
    <meta name="description" content="Roomhy Super Admin Panel — manage properties, cities, pages, SEO, media and settings." />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Preconnect to API for faster first requests -->
    <link rel="preconnect" href="https://api.roomhy.com" crossorigin />
    <link rel="preconnect" href="https://roohmy-backend-6q6z.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }
      body { background: #f8fafc; }
      #admin-init-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f8fafc; z-index: 9999; gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .admin-spinner {
        width: 36px; height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #0ea5e9;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .admin-loader-text {
        font-size: 10px; font-weight: 700; color: #94a3b8;
        letter-spacing: 0.15em; text-transform: uppercase;
      }
      .admin-loader-sub {
        font-size: 11px; color: #cbd5e1; margin-top: -8px;
      }
    </style>
  </head>
  <body>
    <div id="admin-init-loader">
      <div class="admin-spinner"></div>
      <p class="admin-loader-text">Roomhy Admin</p>
      <p class="admin-loader-sub">Loading panel…</p>
    </div>
    <div id="admin-root"></div>
    <script>
      (function() {
        var p = window.location.pathname || '';
        if (p.includes('/superadmin') || p.includes('/admin/superadmin')) {
          window.location.replace('/superadmin/index');
          return;
        }
        var loader = document.getElementById('admin-init-loader');
        var root = document.getElementById('admin-root');
        if (!loader || !root) return;
        var obs = new MutationObserver(function() {
          if (root.children.length > 0) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.25s ease';
            setTimeout(function() { loader.style.display = 'none'; }, 280);
            obs.disconnect();
          }
        });
        obs.observe(root, { childList: true });
        // Failsafe: hide after 2s no matter what
        setTimeout(function() { if (loader) loader.style.display = 'none'; }, 2000);
      })();
    </script>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
