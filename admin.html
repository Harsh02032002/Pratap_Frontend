<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roomhy Admin Panel</title>
    <meta name="description" content="Roomhy Super Admin Panel — manage properties, cities, pages, SEO, media and settings." />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      #admin-init-loader {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #f8fafc; z-index: 9999;
      }
      .admin-spinner {
        width: 36px; height: 36px;
        border: 4px solid #e2e8f0;
        border-top-color: #0ea5e9;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="admin-init-loader">
      <div class="admin-spinner"></div>
    </div>
    <div id="admin-root"></div>
    <script>
      // Hide loader once React mounts
      document.addEventListener('DOMContentLoaded', function() {
        var obs = new MutationObserver(function() {
          var root = document.getElementById('admin-root');
          if (root && root.children.length > 0) {
            var loader = document.getElementById('admin-init-loader');
            if (loader) loader.style.display = 'none';
            obs.disconnect();
          }
        });
        obs.observe(document.getElementById('admin-root'), { childList: true });
      });
    </script>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
